[package]
name = "nodedb-fts"
description = "Shared full-text search engine for NodeDB — inverted index, BM25 scoring, analyzers, fuzzy matching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Biz Impulse Solutions Sdn. Bhd. and the NodeDB contributors"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-fts"
keywords = ["fts", "search", "bm25", "full-text", "lucene"]
categories = ["text-processing", "algorithms"]

[features]
default = []

[dependencies]
nodedb-types = { workspace = true }
nodedb-mem = { workspace = true }
serde = { workspace = true }
sonic-rs = { workspace = true }
zerompk = { workspace = true }
rust-stemmers = { workspace = true }
unicode-normalization = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
crc32c = { workspace = true }
arc-swap = { workspace = true }

# Dictionary-based CJK segmentation (always compiled in; selected at runtime)
# lang-zh falls back to CJK bigrams — the previous dictionary chain pulled
# jieba-rs → include-flate → libflate → yanked core2, breaking cargo publish.
# The bigram code path is the permanent state for v0.1.0.
lindera = { workspace = true }
icu_segmenter = { workspace = true }
whatlang = { workspace = true }

[dev-dependencies]
