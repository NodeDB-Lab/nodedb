[package]
name = "nodedb-client"
description = "Unified NodeDb trait and remote client for NodeDB Origin and Lite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-client"
keywords = ["client", "pgwire", "messagepack", "nodedb", "sdk"]
categories = ["database", "api-bindings"]

[features]
default = []
remote = ["tokio-postgres", "tokio", "serde_json"]
native = ["tokio", "zerompk", "serde_json", "tokio-rustls", "rustls-pemfile"]

[dependencies]
nodedb-types = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# Remote client dependencies (feature-gated)
tokio-postgres = { workspace = true, optional = true, features = ["with-serde_json-1"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
serde_json = { workspace = true, optional = true }
sonic-rs = { workspace = true }

# Native protocol client dependencies (feature-gated)
zerompk = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }

[dev-dependencies]
# The only default-feature tokio use is `#[tokio::test]` in
# src/traits/core/trait_def.rs (8 tests, default current-thread flavour), which
# needs `macros` + `rt`. This narrow set is also the only shape that is legal on
# wasm: `tokio = { workspace = true }` inherits `features = ["full"]`, whose
# fs/io-std/net/process/rt-multi-thread/signal arms trip tokio's wasm
# compile_error. The native/remote feature-gated modules do reach
# net/spawn/io-util/time/sync, but enabling those features re-enables the
# optional production `tokio` dependency below, which carries `full` again.
tokio = { version = "1", default-features = false, features = [
  "io-util",
  "macros",
  "rt",
  "sync",
  "time",
] }

# Restores the pre-split native resolution exactly: off wasm the union of this
# entry and the narrow one above is `full`, as it was before.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
