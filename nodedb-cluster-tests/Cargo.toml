[package]
name = "nodedb-cluster-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "3-node integration test suite for NodeDB. Heavy; runs in its own CI stage."

[lib]
path = "src/lib.rs"

[features]
# Arms the in-process fail points the cluster tests park writes at.
failpoints = ["nodedb/failpoints", "nodedb-types/failpoints"]

[dependencies]

[dev-dependencies]
nodedb = { workspace = true }
nodedb-array = { workspace = true }
nodedb-bridge = { workspace = true }
nodedb-client = { workspace = true, features = ["native"] }
nodedb-cluster = { workspace = true }
nodedb-crdt = { workspace = true }
nodedb-physical = { workspace = true }
nodedb-query = { workspace = true }
nodedb-raft = { workspace = true }
nodedb-types = { workspace = true }
nodedb-test-support = { workspace = true }

tokio = { workspace = true, features = ["test-util"] }
tokio-postgres = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
loro = { workspace = true }
nexar = { workspace = true }
quinn = { workspace = true }
redb = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zerompk = { workspace = true }
