[package]
name = "nodedb-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Shared test harness for NodeDB integration tests (not for end-user consumption)."

[lib]
path = "src/lib.rs"

[dependencies]
# Production crates this harness drives.
nodedb = { workspace = true }
nodedb-array = { workspace = true }
nodedb-physical = { workspace = true }
nodedb-bridge = { workspace = true }
nodedb-client = { workspace = true, features = ["native"] }
nodedb-cluster = { workspace = true }
nodedb-crdt = { workspace = true }
nodedb-mem = { workspace = true }
nodedb-types = { workspace = true }
nodedb-wal = { workspace = true }

# Runtime + wire deps used by the harness itself.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-postgres = { workspace = true }
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
zerompk = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
smallvec = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }

# JWT fixture: mint RS256 tokens against an in-process JWKS endpoint.
rsa = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
