[package]
name = "nodedb-raft"
description = "Raft consensus engine for NodeDB — leader election, log replication, and snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-raft"
keywords = ["raft", "consensus", "replication", "distributed", "leader-election"]
categories = ["algorithms", "network-programming"]

[features]
default = []
# Arms the commit gate (`raft::hold_commit::node<N>::group<G>`) cluster tests
# use to keep an entry uncommitted across a leadership change.
failpoints = ["dep:nodedb-types", "nodedb-types/failpoints"]

[dependencies]
# Workspace
nodedb-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Serialization (compact binary for RPCs)
rkyv = { workspace = true }
zerompk = { workspace = true }

# Random for election timeouts
rand = { workspace = true }

# Checksums
crc32c = { workspace = true }

# Timestamps
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
