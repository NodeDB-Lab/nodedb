[package]
name = "nodedb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb"
keywords = ["database", "vector", "graph", "columnar", "hybrid"]
categories = ["database-implementations", "science::neuroscience"]
description = "Local-first, real-time, edge-to-cloud hybrid database for multi-modal workloads"

[[bin]]
name = "nodedb"
path = "src/main.rs"

[lib]
name = "nodedb"
path = "src/lib.rs"

[dependencies]
# Internal foundation crates
nodedb-types = { workspace = true }
nodedb-columnar = { workspace = true }
nodedb-bridge = { workspace = true }
nodedb-physical = { workspace = true }
rust_decimal = { workspace = true, features = ["db-postgres"] }
nodedb-cluster = { workspace = true, features = ["diagnostics"] }
nodedb-raft = { workspace = true }
nodedb-wal = { workspace = true, features = ["diagnostics"] }
nodedb-mem = { workspace = true }
nodedb-fts = { workspace = true }
nodedb-query = { workspace = true }
nodedb-crdt = { workspace = true }
nodedb-codec = { workspace = true }
nodedb-strict = { workspace = true }
nodedb-spatial = { workspace = true }
nodedb-graph = { workspace = true }
nodedb-vector = { workspace = true }
nodedb-array = { workspace = true }
nodedb-sql = { workspace = true }
arrow = { workspace = true }

# Async runtime (Control Plane)
tokio = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }

# Error handling & diagnostics
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# This crate is the process that owns the recorder: it calls `faultbox::init`,
# runs the out-of-process crash monitor, and feeds the flight recorder from the
# tracing events the server already emits.
faultbox = { workspace = true, features = ["native-crash", "tracing"] }

# Serialization & config
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
chrono = { workspace = true }
redb = { workspace = true }
crc32c = { workspace = true }
zerompk = { workspace = true }
rmpv = { workspace = true }
rkyv = { workspace = true }
roaring = { workspace = true }
arc-swap = { workspace = true }
memchr = { workspace = true }
lexical-core = { workspace = true }
rust-stemmers = { workspace = true }
unicode-normalization = { workspace = true }
tempfile = { workspace = true }
nexar = { workspace = true }
memmap2 = { workspace = true }
rustc-hash = { workspace = true }

# CRDTs (needed for LoroValue in engine layer)
loro = { workspace = true }

# WASM runtime
wasmtime = { workspace = true }
sha2 = { workspace = true }

# Observability dependencies (always compiled in; toggled at runtime via nodedb.toml)
regex = { workspace = true }
prost = { workspace = true }
snap = { workspace = true }
flate2 = { workspace = true }
tonic = { workspace = true }
rdkafka = { workspace = true }
# Direct dep purely so the workspace's `libz-sys` feature set (with `static`)
# applies via Cargo feature unification — keeps zlib statically linked into
# the release binary so runtime images don't need libz.so.1.
libz-sys = { workspace = true }

# Password hashing & cryptography
argon2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
aes-gcm = { workspace = true }
uuid = { workspace = true }
smallvec = { workspace = true }
zeroize = { workspace = true }
aws-sdk-kms = { workspace = true }
aws-config = { workspace = true }

# Cold storage
parquet = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }

# TLS & crypto
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
pem = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
reqwest = { workspace = true }

# PostgreSQL wire protocol
pgwire = { workspace = true }
postgres-types = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

# HTTP API
axum = { workspace = true }
axum-server = { workspace = true }
# `Layer`, to stamp each accepted connection's transport security onto the
# requests served over it (see `control/server/http/tls_accept.rs`).
tower = { workspace = true }

# WebSocket (sync endpoint)
tokio-tungstenite = { workspace = true }

# Compression
zstd = { workspace = true }

# System calls (eventfd for TPC wake)
libc = { workspace = true }

# SQL parser (used by function body validation and procedural executor)
sqlparser = { workspace = true }

# Memory allocator
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

# Random number generation (weighted pick, provably fair gacha)
rand = { workspace = true }

# Hex text for KV overlay keys and OTel trace/span ids
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Named again here (same published version, unified by Cargo) so crash-harness
# integration tests can act as a reader: list and inspect reports the running
# server filed, without depending on the binary's own `faultbox::init` call.
faultbox = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }
proptest = { workspace = true }
nodedb-types = { workspace = true }
reqwest = { workspace = true }
nodedb-array = { workspace = true }
nodedb-test-support = { workspace = true }
rcgen = { workspace = true }
zerompk = { workspace = true }
loro = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# io_uring for Data Plane batched I/O (columnar reads, WAL)
io-uring = { workspace = true }

[features]
default = []
# Enables crash-injection points used by recovery tests. Off by default; tests
# that exercise the framework opt in via `--features failpoints`.
failpoints = ["nodedb-types/failpoints", "nodedb-wal/failpoints"]
