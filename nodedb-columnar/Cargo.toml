[package]
name = "nodedb-columnar"
description = "Columnar segment format and memtable for NodeDB analytical storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Biz Impulse Solutions Sdn. Bhd. and the NodeDB contributors"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-columnar"
keywords = ["columnar", "segment", "compression", "olap", "analytics"]
categories = ["database-implementations", "compression"]

[features]
default = []
# Corrupt memtable cells report through the `faultbox` black-box recorder.
# Inert until the host application calls `faultbox::init`. A no-op on wasm32.
# Off by default so Lite and WASM embedders do not pull the recorder.
diagnostics = ["dep:faultbox"]

[dependencies]
nodedb-types = { workspace = true }
nodedb-spatial = { workspace = true }
nodedb-codec = { workspace = true }
nodedb-mem = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
zerompk = { workspace = true }
crc32c = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
roaring = { workspace = true }
rust_decimal = { workspace = true }
nodedb-wal = { workspace = true }
faultbox = { workspace = true, optional = true }
