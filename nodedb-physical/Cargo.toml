[package]
name = "nodedb-physical"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Biz Impulse Solutions Sdn. Bhd. and the NodeDB contributors"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "Shared PhysicalTask IR and SqlPlan-to-PhysicalPlan converter for NodeDB Origin and Lite"
documentation = "https://docs.rs/nodedb-physical"

[dependencies]
nodedb-array = { workspace = true }
nodedb-crs = { workspace = true }
nodedb-graph = { workspace = true }
nodedb-query = { workspace = true }
nodedb-types = { workspace = true }
rust_decimal = { workspace = true }
# `rc` derives serde for the shared pins of a redo.
serde = { workspace = true, features = ["rc"] }
thiserror = { workspace = true }
zerompk = { workspace = true }

[dev-dependencies]
# Tests resolve EPSG CRSs outside the always-built-in set.
nodedb-crs = { workspace = true, features = ["epsg"] }
