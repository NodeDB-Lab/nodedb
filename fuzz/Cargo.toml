[package]
name = "nodedb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
tempfile = "3"
nodedb-codec = { path = "../nodedb-codec" }
nodedb-columnar = { path = "../nodedb-columnar" }
nodedb-mem = { path = "../nodedb-mem" }
nodedb-strict = { path = "../nodedb-strict" }
nodedb-types = { path = "../nodedb-types" }
nodedb-wal = { path = "../nodedb-wal" }
nodedb-sql = { path = "../nodedb-sql" }

[[bin]]
name = "codec_decoders"
path = "fuzz_targets/codec_decoders.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "columnar_segment"
path = "fuzz_targets/columnar_segment.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "strict_tuple"
path = "fuzz_targets/strict_tuple.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "wal_readers"
path = "fuzz_targets/wal_readers.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "msgpack_document"
path = "fuzz_targets/msgpack_document.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "sql_preprocess"
path = "fuzz_targets/sql_preprocess.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[workspace]
members = ["."]
resolver = "2"
