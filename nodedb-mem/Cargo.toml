[package]
name = "nodedb-mem"
description = "Global NUMA-aware memory governor preventing subsystem OOM and cache cannibalization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-mem"
keywords = ["memory", "jemalloc", "arena", "governor", "allocator"]
categories = ["memory-management", "concurrency"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
nodedb-types = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

# Native-only: see nodedb-wal/Cargo.toml. Both entries resolve tokio with
# `features = ["full"]` (the workspace entry directly, fluxbench through its own
# normal dependency), which tokio rejects on wasm, and neither is referenced by
# any test target in this crate. Native test builds keep them, unchanged.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true }
fluxbench = { workspace = true }
