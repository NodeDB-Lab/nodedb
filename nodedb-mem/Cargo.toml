[package]
name = "nodedb-mem"
description = "Global NUMA-aware memory governor preventing subsystem OOM and cache cannibalization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nodedb-mem"
keywords = ["memory", "jemalloc", "arena", "governor", "allocator"]
categories = ["memory-management", "concurrency"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
nodedb-types = { workspace = true }

[features]
# jemalloc arena pinning and introspection. Enable it only in a binary that
# installs jemalloc as its global allocator. Without it, arena calls are
# no-ops and stats are absent, and no jemalloc C library is linked.
jemalloc = ["dep:tikv-jemalloc-ctl"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tikv-jemalloc-ctl = { workspace = true, optional = true }
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
fluxbench = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
